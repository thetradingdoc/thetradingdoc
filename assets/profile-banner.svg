<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="430" viewBox="0 0 1560 430" role="img" aria-labelledby="title description">
<title id="title">AI Engineer — Solution Design</title>
<desc id="description">Editorial AI engineering header with warm copper, aubergine, indigo and a luminous orbital accent</desc>
<defs>
  <linearGradient id="background" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1560" y2="400">
    <stop stop-color="#38231e"/><stop offset=".28" stop-color="#773d48"/><stop offset=".63" stop-color="#44183f"/><stop offset="1" stop-color="#0d173c"/>
  </linearGradient>
  <radialGradient id="warm" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(296 64) rotate(38) scale(720 390)">
    <stop stop-color="#e2a363" stop-opacity=".58"/><stop offset="1" stop-color="#e2a363" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="violet" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(1370 292) rotate(120) scale(640 590)">
    <stop stop-color="#663ad4" stop-opacity=".73"/><stop offset="1" stop-color="#663ad4" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="orbit" gradientUnits="userSpaceOnUse" x1="905" y1="400" x2="1518" y2="154">
    <stop stop-color="#f6ad6c"/><stop offset=".42" stop-color="#ff95ab"/><stop offset="1" stop-color="#a08cff"/>
  </linearGradient>
  <filter id="soft" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
  </filter>
</defs>
<rect width="1560" height="430" rx="22" fill="url(#background)"/>
<rect width="1560" height="430" rx="22" fill="url(#warm)"/>
<rect width="1560" height="430" rx="22" fill="url(#violet)"/>
<path d="M1050 430 C1155 286 1346 195 1565 173 L1565 430Z" fill="#151d60" opacity=".65"/>
<path d="M1010 440 C1161 314 1370 181 1580 166" fill="none" stroke="#ff9a87" stroke-width="26" opacity=".46" filter="url(#soft)"/>
<path d="M1010 440 C1161 314 1370 181 1580 166" fill="none" stroke="url(#orbit)" stroke-width="4"/>
<path d="M1352 430 C1410 363 1480 328 1565 319" fill="none" stroke="#bca4ff" stroke-width="2" opacity=".72"/>
<rect x="84" y="63" width="293" height="47" rx="23" fill="#261d2c" fill-opacity=".36" stroke="#e5bdad" stroke-opacity=".75" stroke-width="1.2"/>
<text x="114" y="94" fill="#fff0dc" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" letter-spacing="5">SOLUTION DESIGN</text>
<text x="79" y="259" fill="#fff7ef" font-family="Georgia,Times New Roman,serif" font-size="141" font-weight="400">AI <tspan font-style="italic">Engineer</tspan></text>
<text x="91" y="331" fill="#f6e4e6" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400">Turning complex AI ideas into useful, working products.</text>
<text x="93" y="377" fill="#d5b9c5" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2">AGENTS  /  COMPUTER VISION  /  INTERACTIVE SYSTEMS</text>
<rect width="1560" height="430" rx="22" fill="#ffffff" opacity=".14" filter="url(#grain)"/>
</svg>